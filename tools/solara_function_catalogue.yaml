    doc_jp: "レアリティ × ユーザー太陽星座 × 形容詞グループ から背景アセットパスを解決。 候補リスト形式で返し、見つからなければ次を試す (最後は固定 fallback)。  🔴 (2026-05-19) 仕様改訂: - ★5 のみ: bright/bright_{adjGroup}_{userZodiac}.webp (120 枚、太陽星座 × 形容詞色) - ★4: variants_leo or variants_virgo (形容詞色テーマ星座 × 2 ベース、決定論的に A/B) - ★3: variants_scorpio or variants_aquarius - ★1-2: variants_pisces or variants_aries 旧 mystical/ と lite/ は廃止。  決定論的 A/B 選択: cycle.id (millisecondsSinceEpoch 文字列) を seed にして 0/1 を決める。 同じサイクルなら毎回同じ画像が選ばれるので、 Star Atlas で再表示しても 背景が揺らがない。  形容詞によっては片方のフォルダしか画像が無いケース ([baseZodiac]_[themeZodiac] で themeZodiac == baseZodiac は存在しない): ★4: golden (leo) → virgo_leo のみ / infinite (virgo) → leo_virgo のみ ★3: mystic (scorpio) → aquarius_scorpio のみ / frozen (aquarius) → scorpio_aquarius のみ ★1-2: crimson (aries) → pisces_aries のみ この場合は自動的に存在する側を優先順位先頭に置く。"
