  - id: "401c9a15f182"
    file: "screens/map_screen.dart"
    line: 1266
    name: "_kickPaintInvalidation"
    signature: "void _kickPaintInvalidation()"
    doc_jp: "flutter_map TileLayer の描画 invalidation 漏れ既知問題への対症療法。  症状: 検索詳細を 2-3 個開閉、または地図タップで移動した直後、 マップが黒画面化する。エラーログは一切出ない。微小なパン操作で 即座に既存タイルが現れる (= タイルはキャッシュ済、描画だけ止まっている)。  原因 (推定): widget tree の連続変化で Flutter element reconcile が走るが、 TileLayer の RenderObject に paint invalidation が伝わらない瞬間がある。 4 層防御 (mount 遅延 / reset Stream / settle reset 等) は fetch エラー 系の Case C 対策で、paint 系には効かない。  対策: postFrame で camera.center を 1e-7° (≈ 11mm) ずらして戻す。 flutter_map がカメライベントを検知 → markNeedsPaint → 即再描画。 ユーザーが手動でやってる「微小パン」を自動化したもの。  適用箇所: _mapCtrl.move を呼ぶ全ての location (_rebuild / _selectSearchHit / _frameSearchArea / _restoreSearchListView)。  副作用: 地理座標が 11mm ずれて戻るだけ、視覚的に検知不可能。 記録: memory/project_solara_map_paint_invalidation.md"
    name_words_en: ["kick", "paint", "invalidation"]
