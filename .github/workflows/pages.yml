name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage public site (denylist — exclude source & internal only)
        # 🔒 公開Webアプリ(apps/tarot-reading 等)とサイト(legal/blog/psychology/index 等)は
        # そのまま配信し、ソース・内部だけを配信対象から除外する。
        # 除外対象 = モバイルアプリ/WIPソース (apps/solara=Geminiプロンプト本体, apps/diet_app,
        #   apps/US-Quantum-Life-Map, apps/naura, apps/insta-reels, apps/tarot-v2) と
        #   ルートの内部物 (worker/ tools/ docs/ logs/ sns-templates/ と *.md)。
        # ⚠️ apps/ 配下の新規ディレクトリは既定で「配信される」。公開したくない新ソースを
        #   足したら、この exclude 一覧に必ず追記すること。
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='/.git' --exclude='/.github' --exclude='/_site' \
            --exclude='/apps/solara' --exclude='/apps/diet_app' \
            --exclude='/apps/US-Quantum-Life-Map' --exclude='/apps/naura' \
            --exclude='/apps/insta-reels' --exclude='/apps/tarot-v2' \
            --exclude='/worker' --exclude='/tools' --exclude='/docs' \
            --exclude='/logs' --exclude='/sns-templates' \
            --exclude='/apps/shako-map/docs' --exclude='/apps/shako-map/tools' \
            --exclude='/apps/shako-map/spike' \
            --exclude='*.md' \
            ./ _site/
          touch _site/.nojekyll
          echo "=== published top-level ===" && ls _site
          echo "=== published apps/ (should NOT contain solara/diet_app) ===" && ls _site/apps
          echo "=== published apps/shako-map (should NOT contain docs/tools/spike) ===" && ls _site/apps/shako-map
      - name: shako-map の config.js を Secrets から作る（キーはリポジトリに置かない）
        # 🔒 2026-09-13: Google Maps のキーは GitHub Secrets（SHAKO_GOOGLE_MAPS_KEY）から
        #    配信時にだけ config.js へ差し込む。履歴に残らず、取り替えは Secrets の書き換えだけ。
        #    Secrets が空なら空文字で書く＝Google の下敷きは選択肢に出ない（地理院・OSM のみ）。
        #    キー自体は利用者のブラウザに届く公開キー。守りは Google Cloud 側の
        #    HTTP リファラー制限（https://solodev-lab.com/*）と日次上限（config.sample.js 参照）。
        env:
          SHAKO_KEY: ${{ secrets.SHAKO_GOOGLE_MAPS_KEY }}
        run: |
          printf 'window.SHAKO_CONFIG = { GOOGLE_MAPS_API_KEY: "%s" };\n' "$SHAKO_KEY" > _site/apps/shako-map/js/config.js
          if [ -z "$SHAKO_KEY" ]; then echo "SHAKO_GOOGLE_MAPS_KEY は未設定（Google の下敷きは出ない）"; else echo "config.js を書いた（キーの長さ ${#SHAKO_KEY}）"; fi
      - name: shako-map の版番号を書き込む（§30-33）
        # 🔒 §30-33（2026-09-15）: 配信した新しい版が、ブラウザのキャッシュのせいで
        #    利用者の画面に届かない（古い版のまま使われる）のを防ぐ。
        #    配信のたびに**コミット番号(7桁)**を、_site の中の3か所へ同じ値で書き込む。
        #      (a) version.json           … アプリが数分ごと・案件一覧に戻った時に見に行く印
        #      (b) index.html の window.SHAKO_VER … いま動いている版
        #      (c) JS・CSS の ?v=<番号>   … HTML が新しくなれば中身も必ず新しい
        #    🔴 書き換えるのは _site（配信物）だけ。リポジトリのソースは
        #       印（__SHAKO_VER__）のまま＝手元では「版なし」でアプリは何もしない。
        run: |
          VER="${GITHUB_SHA:0:7}"
          AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -z "$VER" ]; then echo "GITHUB_SHA が空（版番号を作れない）" && exit 1; fi
          printf '{"ver":"%s","at":"%s"}\n' "$VER" "$AT" > _site/apps/shako-map/version.json
          sed -i "s/__SHAKO_VER__/$VER/g" _site/apps/shako-map/index.html
          echo "=== version.json ===" && cat _site/apps/shako-map/version.json
          if grep -q '__SHAKO_VER__' _site/apps/shako-map/index.html; then
            echo "置換されていない __SHAKO_VER__ が index.html に残っている" && exit 1
          fi
          HITS=$(grep -o "$VER" _site/apps/shako-map/index.html | wc -l)
          if [ "$HITS" -eq 0 ]; then echo "index.html に版番号が1つも入っていない" && exit 1; fi
          echo "index.html の置換 $HITS 件（版 $VER）"
      - name: legal/solara のルートは ja/ の写し（二重管理を作らない）
        # 🔴 2026-07-29: legal/solara/ の日本語版が「ルート」と「ja/」に同じ内容で2つ在り、
        #    直すたびに両方を手で直す状態だった(6ファイルとも改行以外は完全一致だった)。
        #    正典を ja/ の1本に決め、ルート側の実ファイルはリポジトリから削除した。
        #    ルートURL(https://solodev-lab.com/legal/solara/privacy.html 等)は、
        #    Play Console 等に古い形で登録されている可能性があるので生かしておく必要がある。
        #    → ここで ja/ から配信時に写す＝URLは生きたまま、直す場所は1つだけになる。
        #    リダイレクトにしないのは、審査に提出しているURLで白画面を挟みたくないため。
        # 🔴 ルートに手で .html を戻しても、このステップが ja/ の内容で上書きするので
        #    本番に版ズレは出ない(記憶ではなく仕組みで守る)。index.html は ja/ に無いので触れない。
        run: |
          cp legal/solara/ja/*.html _site/legal/solara/
          echo "=== published legal/solara ===" && ls _site/legal/solara
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
