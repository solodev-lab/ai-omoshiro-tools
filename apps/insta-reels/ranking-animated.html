<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ランキングリール - アニメーション型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    font-family: 'Yu Gothic', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    overflow-y: auto;
  }

  /* === フレーム === */
  .reel-frame {
    width: 675px;
    height: 1200px;
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    background: #000;
    flex-shrink: 0;
  }

  .bg-image {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    filter: brightness(0.4);
    z-index: 0;
  }

  /* === スライド === */
  .slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px 24px;
    z-index: 1;
    opacity: 0;
    pointer-events: none;
    text-align: center;
  }

  .slide.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* === テキストの黒縁取り共通 === */
  .stroke-text {
    text-shadow:
      3px 3px 0 #000, -3px -3px 0 #000,
      3px -3px 0 #000, -3px 3px 0 #000,
      0 3px 0 #000, 0 -3px 0 #000,
      3px 0 0 #000, -3px 0 0 #000,
      0 0 20px rgba(0,0,0,0.8);
  }

  .title-text {
    font-size: 52px;
    font-weight: 900;
    color: #ffd700;
    line-height: 1.35;
  }

  .rank-number {
    font-size: 160px;
    font-weight: 900;
    color: #ffd700;
    line-height: 1;
  }

  .rank-label {
    font-size: 20px;
    color: #aaa;
    letter-spacing: 5px;
    margin-bottom: 10px;
  }

  .rank-main-text {
    font-size: 48px;
    font-weight: 900;
    color: #fff;
    margin-top: 16px;
    line-height: 1.3;
  }

  .rank-desc-text {
    font-size: 26px;
    font-weight: 700;
    color: #ffd700;
    margin-top: 10px;
  }

  .cta-text-main {
    font-size: 30px;
    font-weight: 900;
    color: #fff;
    line-height: 1.5;
  }

  .cta-button {
    display: inline-block;
    margin-top: 24px;
    padding: 18px 44px;
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #000;
    font-size: 20px;
    font-weight: 900;
    border-radius: 30px;
  }

  /* === 上下フェード === */
  .fade-top, .fade-bottom {
    position: absolute; left: 0; width: 100%;
    z-index: 5; pointer-events: none;
  }
  .fade-top { top: 0; height: 30px; background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent); }
  .fade-bottom { bottom: 0; height: 60px; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); }

  /* ============================================================
     アニメーションパターン（20種類）
     ============================================================ */

  /* 1. フェードイン（基本） */
  .anim-fade .anim-target {
    opacity: 0;
    animation: fadeIn 0.8s ease forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  /* 2. 右からスライド（テロップ） */
  .anim-slide-right .anim-target {
    opacity: 0;
    transform: translateX(100%);
    animation: slideRight 0.6s ease-out forwards;
  }
  @keyframes slideRight { to { opacity: 1; transform: translateX(0); } }

  /* 3. 左からスライド */
  .anim-slide-left .anim-target {
    opacity: 0;
    transform: translateX(-100%);
    animation: slideLeft 0.6s ease-out forwards;
  }
  @keyframes slideLeft { to { opacity: 1; transform: translateX(0); } }

  /* 4. 下から浮き上がり */
  .anim-float-up .anim-target {
    opacity: 0;
    transform: translateY(60px);
    animation: floatUp 0.7s ease-out forwards;
  }
  @keyframes floatUp { to { opacity: 1; transform: translateY(0); } }

  /* 5. じわっと浮き出る（ブラーから鮮明に） */
  .anim-blur-in .anim-target {
    opacity: 0;
    filter: blur(20px);
    animation: blurIn 0.8s ease-out forwards;
  }
  @keyframes blurIn { to { opacity: 1; filter: blur(0); } }

  /* 6. 爆発ズームイン */
  .anim-explode .anim-target {
    opacity: 0;
    transform: scale(3);
    animation: explode 0.5s ease-out forwards;
  }
  @keyframes explode { to { opacity: 1; transform: scale(1); } }

  /* 7. バウンスイン（かわいい系） */
  .anim-bounce .anim-target {
    opacity: 0;
    transform: scale(0.3);
    animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
  }
  @keyframes bounceIn { to { opacity: 1; transform: scale(1); } }

  /* 8. 回転して登場 */
  .anim-spin .anim-target {
    opacity: 0;
    transform: rotate(-180deg) scale(0.5);
    animation: spinIn 0.7s ease-out forwards;
  }
  @keyframes spinIn { to { opacity: 1; transform: rotate(0) scale(1); } }

  /* 9. キラキラ登場 */
  .anim-sparkle .anim-target {
    opacity: 0;
    transform: scale(0.8);
    animation: sparkleIn 0.8s ease-out forwards;
  }
  .anim-sparkle .sparkle-container {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  .anim-sparkle .spark {
    position: absolute;
    width: 8px; height: 8px;
    background: #ffd700;
    border-radius: 50%;
    box-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700;
    animation: sparkBurst 1s ease-out forwards;
  }
  @keyframes sparkleIn {
    0% { opacity: 0; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes sparkBurst {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0); }
  }

  /* 10. タイプライター */
  .anim-typewriter .anim-target {
    overflow: hidden;
    white-space: nowrap;
    border-right: 3px solid #ffd700;
    width: 0;
    animation: typewriter 1.2s steps(20) forwards, blink 0.5s step-end infinite alternate;
  }
  @keyframes typewriter { to { width: 100%; } }
  @keyframes blink { 50% { border-color: transparent; } }

  /* 11. 弾むドロップ（上から落ちる） */
  .anim-drop .anim-target {
    opacity: 0;
    transform: translateY(-200px);
    animation: dropBounce 0.7s cubic-bezier(0.25, 0.46, 0.45, 1.2) forwards;
  }
  @keyframes dropBounce {
    0% { opacity: 0; transform: translateY(-200px); }
    60% { opacity: 1; transform: translateY(10px); }
    80% { transform: translateY(-5px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* 12. フリップ（カードめくり） */
  .anim-flip .anim-target {
    opacity: 0;
    transform: perspective(600px) rotateY(90deg);
    animation: flipIn 0.6s ease-out forwards;
  }
  @keyframes flipIn { to { opacity: 1; transform: perspective(600px) rotateY(0); } }

  /* 13. ゴムみたいに伸びる（ぷにっと系） */
  .anim-elastic .anim-target {
    opacity: 0;
    transform: scaleX(0);
    animation: elasticIn 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
  }
  @keyframes elasticIn { to { opacity: 1; transform: scaleX(1); } }

  /* 14. グリッチ（デジタルノイズ） */
  .anim-glitch .anim-target {
    animation: glitch 0.4s steps(2) forwards;
  }
  @keyframes glitch {
    0% { opacity: 0; transform: translate(0); }
    20% { opacity: 0.8; transform: translate(-5px, 3px); color: #ff0040; }
    40% { opacity: 0.9; transform: translate(5px, -3px); color: #00ffff; }
    60% { opacity: 0.95; transform: translate(-3px, 5px); }
    80% { opacity: 1; transform: translate(3px, -5px); }
    100% { opacity: 1; transform: translate(0); color: inherit; }
  }

  /* 15. 光の筋が通過 */
  .anim-light-sweep .anim-target {
    opacity: 0;
    animation: lightFadeIn 0.5s ease forwards;
  }
  .anim-light-sweep .light-bar {
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), transparent);
    animation: lightSweep 0.8s ease-out 0.2s forwards;
    pointer-events: none;
    z-index: 10;
  }
  @keyframes lightFadeIn { to { opacity: 1; } }
  @keyframes lightSweep { to { left: 200%; } }

  /* 16. パーティクルシャワー */
  .anim-particles .anim-target {
    opacity: 0;
    animation: fadeIn 0.6s ease 0.3s forwards;
  }

  /* 17. 文字が1つずつ登場（ポップ） */
  .anim-char-pop .anim-target span {
    display: inline-block;
    opacity: 0;
    transform: translateY(20px) scale(0.5);
    animation: charPop 0.4s ease forwards;
  }
  @keyframes charPop {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 18. 波打ち（ウェーブ） */
  .anim-wave .anim-target span {
    display: inline-block;
    opacity: 0;
    animation: waveIn 0.6s ease forwards;
  }
  @keyframes waveIn {
    0% { opacity: 0; transform: translateY(30px) rotate(10deg); }
    60% { transform: translateY(-5px) rotate(-2deg); }
    100% { opacity: 1; transform: translateY(0) rotate(0); }
  }

  /* 19. ハート散らし（かわいい系） */
  .anim-hearts .anim-target {
    opacity: 0;
    transform: scale(0.8);
    animation: heartsIn 0.6s ease-out forwards;
  }
  .anim-hearts .heart {
    position: absolute;
    font-size: 24px;
    animation: heartFloat 1.5s ease-out forwards;
    pointer-events: none;
    z-index: 10;
  }
  @keyframes heartsIn { to { opacity: 1; transform: scale(1); } }
  @keyframes heartFloat {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--hx), var(--hy)) scale(0.3); }
  }

  /* 20. シャッター（上下から閉じて開く） */
  .anim-shutter .shutter-top, .anim-shutter .shutter-bottom {
    position: absolute; left: 0; width: 100%; height: 50%;
    background: #000; z-index: 10;
    animation: shutterOpen 0.6s ease-out 0.3s forwards;
  }
  .anim-shutter .shutter-top { top: 0; transform-origin: top; }
  .anim-shutter .shutter-bottom { bottom: 0; transform-origin: bottom; }
  @keyframes shutterOpen { to { transform: scaleY(0); } }
  .anim-shutter .anim-target {
    opacity: 0;
    animation: fadeIn 0.3s ease 0.3s forwards;
  }

  /* ============================================================
     フォントスタイル（8種類）
     ============================================================ */

  /* 1. ネオングロー（ピンク） */
  .fontstyle-neon-pink .title-text,
  .fontstyle-neon-pink .rank-main-text {
    color: #ff00ff;
    text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff, 0 0 80px #ff00ff, 3px 3px 0 #000, -2px -2px 0 #000;
  }
  .fontstyle-neon-pink .rank-number {
    color: #ff69b4;
    text-shadow: 0 0 10px #ff69b4, 0 0 30px #ff69b4, 0 0 60px #ff69b4, 3px 3px 0 #000;
  }
  .fontstyle-neon-pink .rank-desc-text { color: #ffb6c1; text-shadow: 0 0 10px #ff69b4, 3px 3px 0 #000; }

  /* 2. ネオングロー（ブルー） */
  .fontstyle-neon-blue .title-text,
  .fontstyle-neon-blue .rank-main-text {
    color: #00ffff;
    text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #0088ff, 0 0 80px #0088ff, 3px 3px 0 #000, -2px -2px 0 #000;
  }
  .fontstyle-neon-blue .rank-number {
    color: #00d4ff;
    text-shadow: 0 0 10px #00d4ff, 0 0 30px #0088ff, 0 0 60px #0044ff, 3px 3px 0 #000;
  }
  .fontstyle-neon-blue .rank-desc-text { color: #88ddff; text-shadow: 0 0 10px #0088ff, 3px 3px 0 #000; }

  /* 3. ネオングロー（グリーン） */
  .fontstyle-neon-green .title-text,
  .fontstyle-neon-green .rank-main-text {
    color: #00ff88;
    text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88, 0 0 40px #00cc66, 0 0 80px #00cc66, 3px 3px 0 #000, -2px -2px 0 #000;
  }
  .fontstyle-neon-green .rank-number {
    color: #00ff66;
    text-shadow: 0 0 10px #00ff66, 0 0 30px #00cc44, 0 0 60px #009933, 3px 3px 0 #000;
  }
  .fontstyle-neon-green .rank-desc-text { color: #88ffaa; text-shadow: 0 0 10px #00cc66, 3px 3px 0 #000; }

  /* 4. メタリックゴールド（グラデーション金属） */
  .fontstyle-metal-gold .stroke-text { text-shadow: none; }
  .fontstyle-metal-gold .title-text,
  .fontstyle-metal-gold .rank-main-text {
    background: linear-gradient(180deg, #ffd700 0%, #ffaa00 30%, #fff8dc 50%, #daa520 70%, #b8860b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(3px 3px 0 #000) drop-shadow(-2px -2px 0 #000);
  }
  .fontstyle-metal-gold .rank-number {
    background: linear-gradient(180deg, #fff8dc 0%, #ffd700 25%, #ff8c00 50%, #ffd700 75%, #fff8dc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(3px 3px 0 #000) drop-shadow(0 0 20px rgba(255,215,0,0.5));
  }
  .fontstyle-metal-gold .rank-desc-text {
    background: linear-gradient(180deg, #ffd700, #ffaa00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(2px 2px 0 #000);
  }
  .fontstyle-metal-gold .rank-label {
    color: #daa520;
    text-shadow: 0 0 10px rgba(255,215,0,0.4), 2px 2px 0 #000;
  }

  /* 5. メタリックシルバー */
  .fontstyle-metal-silver .stroke-text { text-shadow: none; }
  .fontstyle-metal-silver .title-text,
  .fontstyle-metal-silver .rank-main-text {
    background: linear-gradient(180deg, #ffffff 0%, #c0c0c0 30%, #ffffff 50%, #a0a0a0 70%, #808080 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(3px 3px 0 #000) drop-shadow(-2px -2px 0 #000);
  }
  .fontstyle-metal-silver .rank-number {
    background: linear-gradient(180deg, #ffffff 0%, #e0e0e0 25%, #a0a0a0 50%, #e0e0e0 75%, #ffffff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(3px 3px 0 #000) drop-shadow(0 0 20px rgba(200,200,200,0.4));
  }
  .fontstyle-metal-silver .rank-desc-text {
    background: linear-gradient(180deg, #e0e0e0, #808080);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(2px 2px 0 #000);
  }
  .fontstyle-metal-silver .rank-label {
    color: #c0c0c0;
    text-shadow: 0 0 10px rgba(255,255,255,0.3), 2px 2px 0 #000;
  }

  /* 6. 炎グロー */
  .fontstyle-fire-glow .stroke-text { text-shadow: none; }
  .fontstyle-fire-glow .title-text,
  .fontstyle-fire-glow .rank-main-text {
    background: linear-gradient(180deg, #ffff00 0%, #ff8800 40%, #ff4400 70%, #cc0000 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(3px 3px 0 #000) drop-shadow(0 0 15px rgba(255,100,0,0.7));
  }
  .fontstyle-fire-glow .rank-number {
    background: linear-gradient(180deg, #ffff44 0%, #ff8800 50%, #ff2200 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(3px 3px 0 #000) drop-shadow(0 0 30px rgba(255,68,0,0.8));
  }
  .fontstyle-fire-glow .rank-desc-text {
    background: linear-gradient(180deg, #ffff00, #ff4400);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(2px 2px 0 #000) drop-shadow(0 0 10px rgba(255,68,0,0.5));
  }
  .fontstyle-fire-glow .rank-label {
    color: #ff6600;
    text-shadow: 0 0 10px rgba(255,68,0,0.5), 2px 2px 0 #000;
  }

  /* 7. レインボーグラデーション */
  .fontstyle-rainbow .stroke-text { text-shadow: none; }
  .fontstyle-rainbow .title-text,
  .fontstyle-rainbow .rank-main-text {
    background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #0088ff, #ff00ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(3px 3px 0 #000) drop-shadow(-2px -2px 0 #000);
  }
  .fontstyle-rainbow .rank-number {
    background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #00ffff, #8800ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(3px 3px 0 #000) drop-shadow(0 0 20px rgba(255,255,255,0.3));
  }
  .fontstyle-rainbow .rank-desc-text {
    background: linear-gradient(90deg, #ff8800, #ffff00, #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(2px 2px 0 #000);
  }
  .fontstyle-rainbow .rank-label {
    background: linear-gradient(90deg, #ff0000, #ffff00, #00ffff, #ff00ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(2px 2px 0 #000);
  }

  /* 8. ホワイトグロー（光る白文字） */
  .fontstyle-white-glow .title-text,
  .fontstyle-white-glow .rank-main-text {
    color: #ffffff;
    text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 40px rgba(255,255,255,0.5), 3px 3px 0 #000, -2px -2px 0 #000;
  }
  .fontstyle-white-glow .rank-number {
    color: #ffffff;
    text-shadow: 0 0 15px #fff, 0 0 30px #fff, 0 0 60px rgba(255,255,255,0.4), 3px 3px 0 #000;
  }
  .fontstyle-white-glow .rank-desc-text { color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.6), 3px 3px 0 #000; }

  /* === 順位の色パレット === */
  .rank-1-color .rank-number { color: #ffd700; }
  .rank-2-color .rank-number { color: #c0c0c0; }
  .rank-3-color .rank-number { color: #cd7f32; }

  /* === かわいいテーマ === */
  .theme-cute .rank-number {
    color: #ff69b4;
    text-shadow: 3px 3px 0 #c71585, -2px -2px 0 #c71585, 2px -2px 0 #c71585, -2px 2px 0 #c71585, 0 0 30px rgba(255,105,180,0.5);
  }
  .theme-cute .rank-main-text { color: #fff0f5; }
  .theme-cute .rank-desc-text { color: #ff69b4; }
  .theme-cute .title-text { color: #ff69b4; }
  .theme-cute .rank-label { color: #ff69b4; letter-spacing: 2px; }

  /* === クールテーマ === */
  .theme-cool .rank-number {
    color: #00d4ff;
    text-shadow: 3px 3px 0 #004466, -2px -2px 0 #004466, 2px -2px 0 #004466, -2px 2px 0 #004466, 0 0 30px rgba(0,212,255,0.5);
  }
  .theme-cool .rank-desc-text { color: #00d4ff; }
  .theme-cool .title-text { color: #00d4ff; }

  /* === 炎テーマ === */
  .theme-fire .rank-number {
    color: #ff4500;
    text-shadow: 3px 3px 0 #8b0000, -2px -2px 0 #8b0000, 2px -2px 0 #8b0000, -2px 2px 0 #8b0000, 0 0 30px rgba(255,69,0,0.5);
  }
  .theme-fire .rank-desc-text { color: #ff6347; }
  .theme-fire .title-text { color: #ff4500; }

  /* ============================================================
     リストモード
     ============================================================ */
  .list-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 12px 16px;
  }

  .list-title {
    text-align: center;
    font-size: 28px;
    font-weight: 900;
    color: #ffd700;
    margin-bottom: 8px;
    line-height: 1.2;
  }

  .list-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 3px 10px;
  }

  .list-rank {
    font-size: 26px;
    font-weight: 900;
    color: #ffd700;
    min-width: 45px;
    text-align: center;
  }

  .list-rank-1 { color: #ffd700; }
  .list-rank-2 { color: #c0c0c0; }
  .list-rank-3 { color: #cd7f32; }

  .list-text {
    font-size: 18px;
    font-weight: 900;
    color: #fff;
  }

  .list-desc {
    font-size: 11px;
    color: #ffd700;
    opacity: 0.8;
  }

  .list-cta {
    text-align: center;
    margin-top: 8px;
  }

  /* リストアニメーション（JS制御のみ） */
  .list-hidden { opacity: 0 !important; }
  @keyframes listDrop { from { opacity:0; transform:translateY(-60px); } to { opacity:1; transform:translateY(0); } }
  @keyframes listRise { from { opacity:0; transform:translateY(60px); } to { opacity:1; transform:translateY(0); } }
  @keyframes listSlideR { from { opacity:0; transform:translateX(100%); } to { opacity:1; transform:translateX(0); } }
  @keyframes listSlideL { from { opacity:0; transform:translateX(-100%); } to { opacity:1; transform:translateX(0); } }

function buildSlides() {
  const c = document.getElementById('slidesContainer');
  let html = '';
  let idx = 0;

  const configs = RANKING_DATA.slice(0, selectedRankingCount);
  configs.forEach((cfg, ci) => {
    // タイトル
    html += `<div class="slide title-slide" data-index="${idx}">
      <div class="rank-label stroke-text">━━ RANKING${configs.length > 1 ? ' ' + (ci + 1) : ''} ━━</div>
      <div class="title-text stroke-text anim-target">${cfg.title.replace(/\n/g,'<br>')}</div>
    </div>`;
    idx++;

    // ランキング（selectedRankLimitで制限）
    const limitedRankings = cfg.rankings.filter(r => r.rank <= selectedRankLimit);
    const sorted = displayOrder === 'desc' ? [...limitedRankings].reverse() : [...limitedRankings];
    const maxRank = Math.max(...limitedRankings.map(r => r.rank));
    sorted.forEach(item => {
      let colorClass = item.rank <= 3 ? `rank-${item.rank}-color` : '';
      if (item.rank === maxRank) colorClass += ' rank-last-color';
      html += `<div class="slide ${colorClass}" data-index="${idx}">
        <div class="rank-label stroke-text">━━ RANK ━━</div>
        <div class="rank-number stroke-text anim-target">${item.rank}</div>
        <div class="rank-main-text stroke-text anim-target">${item.text}</div>
        ${item.desc ? `<div class="rank-desc-text stroke-text anim-target">${item.desc}</div>` : ''}
      </div>`;
      idx++;
    });

    // CTA
    html += `<div class="slide" data-index="${idx}">
      <div class="cta-text-main stroke-text anim-target">${cfg.cta.text.replace(/\n/g,'<br>')}</div>
      <div class="cta-button anim-target">${cfg.cta.button}</div>
    </div>`;
    idx++;
  });

  c.innerHTML = html;
  totalSlides = idx;
}

// ============================================================
// アニメーション適用
// ============================================================
function getSlideStyle(slideEl) {
  const isTitle = slideEl.classList.contains('title-slide');
  const isRank1 = slideEl.classList.contains('rank-1-color');
  const isLast = slideEl.classList.contains('rank-last-color');
  let theme = currentTheme;
  let fontStyle = currentFontStyle;
  if (isTitle && titleTheme !== '_default') theme = titleTheme;
  if (isTitle && titleFontStyle !== '_default') fontStyle = titleFontStyle;
  if (isRank1 && rank1Theme !== '_default') theme = rank1Theme;
  if (isRank1 && rank1FontStyle !== '_default') fontStyle = rank1FontStyle;
  if (isLast && !isRank1 && lastTheme !== '_default') theme = lastTheme;
  if (isLast && !isRank1 && lastFontStyle !== '_default') fontStyle = lastFontStyle;
  return { theme, fontStyle };
}

function applyAnimation(slideEl) {
  const cls = `anim-${currentAnim}`;
  const style = getSlideStyle(slideEl);
  // テーマ
  slideEl.className = slideEl.className.replace(/theme-\w+/g, '');
  if (style.theme) slideEl.classList.add(`theme-${style.theme}`);
  // フォントスタイル
  slideEl.className = slideEl.className.replace(/fontstyle-[\w-]+/g, '');
  if (style.fontStyle) slideEl.classList.add(`fontstyle-${style.fontStyle}`);

  // アニメーションクラスをリセット
  slideEl.className = slideEl.className.replace(/anim-[\w-]+/g, '');
  // reflow
  void slideEl.offsetWidth;
  slideEl.classList.add(cls);

  // 特殊エフェクト生成
  if (currentAnim === 'sparkle') addSparkles(slideEl);
  if (currentAnim === 'hearts') addHearts(slideEl);
  if (currentAnim === 'particles') addParticleShower(slideEl);
  if (currentAnim === 'light-sweep') addLightBar(slideEl);
  if (currentAnim === 'shutter') addShutter(slideEl);
  if (currentAnim === 'char-pop' || currentAnim === 'wave') wrapChars(slideEl);
}

function addSparkles(el) {
  let container = el.querySelector('.sparkle-container');
  if (!container) {
    container = document.createElement('div');
    container.className = 'sparkle-container';
    el.appendChild(container);
  }
  container.innerHTML = '';
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.setProperty('--sx', (Math.random()-0.5)*100 + 'px');
    s.style.setProperty('--sy', (Math.random()-0.5)*100 + 'px');
    s.style.animationDelay = Math.random() * 0.5 + 's';
    container.appendChild(s);
  }
}

function addHearts(el) {
  el.querySelectorAll('.heart').forEach(h => h.remove());
  const emojis = ['💖','💕','💗','💓','🩷','✨'];
  for (let i = 0; i < 15; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left = Math.random() * 100 + '%';
    h.style.top = Math.random() * 100 + '%';
    h.style.setProperty('--hx', (Math.random()-0.5)*150 + 'px');
    h.style.setProperty('--hy', -(50 + Math.random()*100) + 'px');
    h.style.animationDelay = Math.random() * 0.8 + 's';
    el.appendChild(h);
  }
}

function addParticleShower(el) {
  el.querySelectorAll('.particle-el').forEach(p => p.remove());
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle-el';
    p.style.cssText = `
      position:absolute; width:4px; height:4px;
      background:#ffd700; border-radius:50%;
      box-shadow: 0 0 6px #ffd700;
      left:${Math.random()*100}%; top:-5%;
      animation: particleFall ${1+Math.random()*2}s linear ${Math.random()*0.5}s forwards;
      pointer-events:none; z-index:10;
    `;
    el.appendChild(p);
  }
  if (!document.getElementById('particleFallStyle')) {
    const style = document.createElement('style');
    style.id = 'particleFallStyle';
    style.textContent = `@keyframes particleFall { to { top: 110%; opacity: 0; } }`;
    document.head.appendChild(style);
  }
}

function addLightBar(el) {
  el.querySelectorAll('.light-bar').forEach(l => l.remove());
  const bar = document.createElement('div');
  bar.className = 'light-bar';
  el.appendChild(bar);
}

function addShutter(el) {
  el.querySelectorAll('.shutter-top,.shutter-bottom').forEach(s => s.remove());
  const t = document.createElement('div'); t.className = 'shutter-top';
  const b = document.createElement('div'); b.className = 'shutter-bottom';
  el.appendChild(t);
  el.appendChild(b);
}

function wrapChars(el) {
  el.querySelectorAll('.anim-target').forEach(target => {
    const text = target.textContent;
    if (target.querySelector('span')) return;
    target.innerHTML = '';
    [...text].forEach((ch, i) => {
      const span = document.createElement('span');
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      span.style.animationDelay = (i * 0.06) + 's';
      target.appendChild(span);
    });
  });
}

// スライド操作
// ============================================================
function showSlide(index) {
  if (index < 0 || index >= totalSlides) return;
  currentSlide = index;

  document.querySelectorAll('.slide').forEach((s, i) => {
    s.classList.remove('active');
    s.className = s.className.replace(/anim-[\w-]+/g, '').replace(/theme-\w+/g, '').replace(/fontstyle-[\w-]+/g, '');
    // 特殊要素除去
    s.querySelectorAll('.sparkle-container,.heart,.particle-el,.light-bar,.shutter-top,.shutter-bottom').forEach(x => x.remove());
  });

  const slide = document.querySelectorAll('.slide')[index];
  slide.classList.add('active');
  applyAnimation(slide);
}

function prevSlide() {
  if (displayMode === 'list') { listPrev(); return; }
  if (currentSlide > 0) showSlide(currentSlide - 1);
}

function nextSlide() {
  if (displayMode === 'list') { listNext(); return; }
  if (currentSlide < totalSlides - 1) showSlide(currentSlide + 1);
  else if (autoTimer) stopPlay();
}

function playAll() {
  if (displayMode === 'list') { listPlayAll(); return; }
  stopPlay();
  showSlide(0);
  const interval = parseFloat(document.getElementById('intervalSlider').value) * 1000;
  autoTimer = setInterval(() => {
    if (currentSlide < totalSlides - 1) showSlide(currentSlide + 1);
    else stopPlay();
  }, interval);
}

function stopPlay() {
  if (displayMode === 'list') { listStopPlay(); return; }
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
}

function resetAll() {
  if (displayMode === 'list') { listReset(); return; }
  stopPlay();
  showSlide(0);
}

function toggleFullscreen() {
  const frame = document.getElementById('reelFrame');
  const panel = document.getElementById('panel');
  frame.classList.toggle('fullscreen');
  const isFull = frame.classList.contains('fullscreen');
  panel.style.display = isFull ? 'none' : '';
}

let listTimer = null;
let listCurrentItem = -1;

function buildListView() {
  let existing = document.getElementById('listContainer');
  if (existing) existing.remove();
  listCurrentItem = -1;

  const frame = document.getElementById('reelFrame');
  const container = document.createElement('div');
  container.id = 'listContainer';
  container.className = 'list-container';
  if (currentFontStyle) container.classList.add(`fontstyle-${currentFontStyle}`);
  if (currentTheme) container.classList.add(`theme-${currentTheme}`);

  let html = '';
  const configs = RANKING_DATA.slice(0, selectedRankingCount);
  configs.forEach((cfg, ci) => {
    const limitedRankings = cfg.rankings.filter(r => r.rank <= selectedRankLimit);
    const maxRank = Math.max(...limitedRankings.map(r => r.rank));
    // タイトル個別スタイル
    let titleClasses = 'list-title stroke-text';
    if (titleTheme !== '_default' && titleTheme) titleClasses += ` theme-${titleTheme}`;
    if (titleFontStyle !== '_default' && titleFontStyle) titleClasses += ` fontstyle-${titleFontStyle}`;
    html += `<div class="${titleClasses} list-hidden">${ci > 0 ? '<hr style="border-color:#555;margin:6px 0;">' : ''}${cfg.title.replace(/\n/g,'<br>')}</div>`;

    let rankings = displayOrder === 'desc' ? [...limitedRankings].reverse() : [...limitedRankings];

    rankings.forEach((item, i) => {
      const rankColorClass = item.rank <= 3 ? `list-rank-${item.rank}` : '';
      const isRank1 = item.rank === 1;
      const isLast = item.rank === maxRank;
      let extraClass = '';
      if (isRank1 && rank1Theme !== '_default' && rank1Theme) extraClass += ` theme-${rank1Theme}`;
      if (isRank1 && rank1FontStyle !== '_default' && rank1FontStyle) extraClass += ` fontstyle-${rank1FontStyle}`;
      if (isLast && !isRank1 && lastTheme !== '_default' && lastTheme) extraClass += ` theme-${lastTheme}`;
      if (isLast && !isRank1 && lastFontStyle !== '_default' && lastFontStyle) extraClass += ` fontstyle-${lastFontStyle}`;
      html += `<div class="list-item stroke-text${extraClass} list-hidden">
        <span class="list-rank ${rankColorClass}">${item.rank}</span>
        <span>
          <span class="list-text">${item.text}</span>
          ${item.desc ? `<span class="list-desc"> ${item.desc}</span>` : ''}
        </span>
      </div>`;
    });

    html += `<div class="list-cta stroke-text list-hidden">
      <div class="cta-text-main" style="font-size:22px;">${cfg.cta.text.replace(/\n/g,'<br>')}</div>
      <div class="cta-button" style="font-size:14px;padding:10px 24px;">${cfg.cta.button}</div>
    </div>`;
  });

  container.innerHTML = html;
  frame.appendChild(container);
}

function listPlayAll() {
  listStopPlay();
  const container = document.getElementById('listContainer');
  if (!container) return;
  const items = container.querySelectorAll('.list-title, .list-item, .list-cta');
  // リセット
  items.forEach(el => { el.classList.add('list-hidden'); el.style.animation = ''; });
  listCurrentItem = -1;
  const interval = parseFloat(document.getElementById('intervalSlider').value) * 1000;
  listShowNext(items, interval);
}

function listRevealItem(el) {
  el.classList.remove('list-hidden');
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = `${getListAnimName()} 0.5s ease-out forwards`;
}

function listShowNext(items, interval) {
  listCurrentItem++;
  if (listCurrentItem >= items.length) { listStopPlay(); return; }
  listRevealItem(items[listCurrentItem]);
  listTimer = setTimeout(() => listShowNext(items, interval), interval);
}

function listStopPlay() {
  if (listTimer) { clearTimeout(listTimer); listTimer = null; }
}

function listReset() {
  listStopPlay();
  const container = document.getElementById('listContainer');
  if (!container) return;
  container.querySelectorAll('.list-title, .list-item, .list-cta').forEach(el => {
    el.classList.add('list-hidden');
    el.style.animation = '';
  });
  listCurrentItem = -1;
}

function listPrev() {
  const container = document.getElementById('listContainer');
  if (!container) return;
  const items = container.querySelectorAll('.list-title, .list-item, .list-cta');
  if (listCurrentItem > 0) {
    items[listCurrentItem].classList.add('list-hidden');
    items[listCurrentItem].style.animation = '';
    listCurrentItem--;
  }
}

function getListAnimName() {
  return currentListAnim === 'drop' ? 'listDrop' :
         currentListAnim === 'rise' ? 'listRise' :
         currentListAnim === 'slide-right' ? 'listSlideR' :
         currentListAnim === 'slide-left' ? 'listSlideL' :
         currentListAnim === 'scale' ? 'listScale' : 'listFade';
}

function listNext() {
  const container = document.getElementById('listContainer');
  if (!container) return;
  const items = container.querySelectorAll('.list-title, .list-item, .list-cta');
  if (listCurrentItem < items.length - 1) {
    listCurrentItem++;
    listRevealItem(items[listCurrentItem]);
  }
}

function buildBgGrid() {
  const grid = document.getElementById('bgGrid');
  grid.innerHTML = '<button class="bg-btn" onclick="promptCustomBg()">📁 自分の画像</button>' +
    BACKGROUNDS.map((b, i) =>
      `<button class="bg-btn ${i===0?'selected':''}" data-bg="${i}" onclick="setBg(${i})">${b.name}</button>`
    ).join('');
}

function setBg(index) {
  document.getElementById('bgImage').style.backgroundImage = `url('${BACKGROUNDS[index].url}')`;
  document.querySelectorAll('.bg-btn[data-bg]').forEach((b, i) => b.classList.toggle('selected', i === index));
}

function promptCustomBg() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (file) document.getElementById('bgImage').style.backgroundImage = `url('${URL.createObjectURL(file)}')`;
  };
  input.click();
}

// スライダー
document.getElementById('intervalSlider').addEventListener('input', (e) => {
  document.getElementById('intervalVal').textContent = e.target.value + '秒';
});

document.getElementById('brightSlider').addEventListener('input', (e) => {
  document.getElementById('brightVal').textContent = e.target.value + '%';
  document.getElementById('bgImage').style.filter = `brightness(${e.target.value/100})`;
});

// キーボード
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
  if (e.key === 'Enter') { e.preventDefault(); playAll(); }
  if (e.key === 'f') { e.preventDefault(); toggleFullscreen(); }
  if (e.key === 'r') { e.preventDefault(); resetAll(); }
  if (e.key === 'Escape') {
    const frame = document.getElementById('reelFrame');
    if (frame.classList.contains('fullscreen')) toggleFullscreen();
  }
});

// 初期化
updateRankingList();
buildSlides();
buildAnimGrid();
buildListAnimGrid();
buildThemeGrid();
buildFontStyleGrid();
buildPerElementSelects();
buildBgGrid();
setBg(0);
showSlide(0);
</script>

</body>
</html>
