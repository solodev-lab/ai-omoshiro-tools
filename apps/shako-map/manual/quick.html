    <figure class="qk-cell fig"><figcaption><span class="nb">1</span><span class="qk-say">使用の本拠の住所を入れて<span class="btn">［検索］</span></span></figcaption><div class="qk-img"><img src="img/qk-sz1.png" alt="使用の本拠の住所を入れて［検索］"></div></figure>
    <figure class="qk-cell fig"><figcaption><span class="nb">2</span><span class="qk-say">形を選んで、青いピンをクリック（◎）</span></figcaption><div class="qk-img"><img src="img/qk-sz2.png" alt="形を選んで、青いピンをクリック（◎）"></div></figure>
    <figure class="qk-cell fig"><figcaption><span class="nb">3</span><span class="qk-say">駐車場の住所を入れて<span class="btn">［検索］</span></span></figcaption><div class="qk-img"><img src="img/qk-sz3.png" alt="駐車場の住所を入れて［検索］"></div></figure>
    <figure class="qk-cell fig"><figcaption><span class="nb">4</span><span class="qk-say">形を選んで、橙のピンをクリック（■）</span></figcaption><div class="qk-img"><img src="img/qk-sz4.png" alt="形を選んで、橙のピンをクリック（■）"></div></figure>
    <figure class="qk-cell fig"><figcaption><span class="nb">5</span><span class="qk-say"><span class="btn">［所在図を作る］</span>→<span class="btn">［標準の設定で作る］</span></span></figcaption><div class="qk-img"><img src="img/qk-sz5.png" alt="［所在図を作る］→［標準の設定で作る］"></div></figure>
    <figure class="qk-cell fig"><figcaption><span class="nb">6</span><span class="qk-say"><span class="btn">［プレビュー］</span>で完成。<span class="btn">［PDF で保存］</span></span></figcaption><div class="qk-img"><img src="img/qk-sz6.png" alt="［プレビュー］で完成。［PDF で保存］"></div></figure>

    <figure class="qk-cell fig"><figcaption><span class="nb">4</span><span class="qk-say"><span class="btn">［幅の矢印］</span>→<span class="btn">［自動入力］</span>→ 出入口の端から端へ</span></figcaption><div class="qk-img"><img src="img/qk-hz4.png" alt="［幅の矢印］→［自動入力］→ 出入口の端から端へ"></div></figure>
    <figure class="qk-cell fig"><figcaption><span class="nb">5</span><span class="qk-say"><span class="btn">［A］</span>→<span class="btn">［道路］</span>→ 地図をクリック</span></figcaption><div class="qk-img"><img src="img/qk-hz5.png" alt="［A］→［道路］→ 地図をクリック"></div></figure>
    <figure class="qk-cell fig"><figcaption><span class="nb">6</span><span class="qk-say">同じく道路の端から端へドラッグ</span></figcaption><div class="qk-img"><img src="img/qk-hz6.png" alt="同じく道路の端から端へドラッグ"></div></figure>
    <figure class="qk-cell fig"><figcaption><span class="nb">7</span><span class="qk-say"><span class="btn">［駐車枠］</span>で枠を並べ、<span class="btn">［番号］</span>でなぞる</span></figcaption><div class="qk-img"><img src="img/qk-hz7.png" alt="［駐車枠］で枠を並べ、［番号］でなぞる"></div></figure>
    <figure class="qk-cell fig"><figcaption><span class="nb">8</span><span class="qk-say"><span class="btn">［保管場所マーク］</span>→ 枠 →<span class="btn">［保管場所ラベル配置］</span></span></figcaption><div class="qk-img"><img src="img/qk-hz8.png" alt="［保管場所マーク］→ 枠 →［保管場所ラベル配置］"></div></figure>

<div class="zoom" id="zoom" hidden><img alt=""></div>
<script>
/* 画面で見る時だけ: 画像を押すと大きく出す（もう一度押すと閉じる）。印刷には関係しない */
(function () {
  var z = document.getElementById('zoom'), zi = z.querySelector('img');
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.matches && t.matches('.fig img')) { zi.src = t.src; z.hidden = false; return; }
    if (!z.hidden) z.hidden = true;
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') z.hidden = true; });
})();
</script>
