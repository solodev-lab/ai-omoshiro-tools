<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{doc_title}}</title>
<link rel="stylesheet" href="manual.css">
</head>
<body>
<!-- 紙のマニュアル（正典 §36）。このファイルは tools/build.py が manual.html を作る時の型。
     🔴 manual.html は手で直さない（build.py が上書きする）。文は pages.json、見た目は manual.css。 -->
<nav class="toc" aria-label="目次">
  <p class="toc-h">{{doc_title}}</p>
  <p class="toc-v">版 {{version}}</p>
  <ol>
{{toc}}
  </ol>
</nav>
<main class="pages">
{{pages}}
</main>
<div class="zoom" id="zoom" hidden><img alt=""></div>
<script>
/* 画面で見る時だけ: 画像を押すと大きく出す（もう一度押すと閉じる）。印刷には関係しない */
(function () {
  var z = document.getElementById('zoom'), zi = z.querySelector('img');
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.matches && t.matches('.fig img')) { zi.src = t.src; z.hidden = false; return; }
    if (!z.hidden) z.hidden = true;
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') z.hidden = true; });
})();
</script>
</body>
</html>
