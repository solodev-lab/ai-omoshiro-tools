# Solara iOS リリースワークフロー (Mac 不要・Codemagic クラウドビルド)
#
# 役割:
#   Windows で開発した Flutter アプリ (Solara) を Codemagic のクラウド macOS で
#   ビルド・自動署名し、TestFlight (→ App Store) へ提出する。Mac は一切不要。
#
# モノレポ注意:
#   このリポジトリは複数アプリのモノレポ。Solara は apps/solara/ にあるため
#   working_directory で指定する。Codemagic にはこのリポジトリ全体を接続し、
#   codemagic.yaml は apps/solara/codemagic.yaml が使われる。
#
# オーナーが Codemagic UI 側で事前に用意するもの (詳細は docs/codemagic_setup.md):
#   1. App Store Connect API キーを integrations に登録。下の
#      integrations.app_store_connect の名前を、登録した「キー名」と一致させる。
#   2. 環境変数グループ solara_ios_secrets を作成し以下を登録:
#        - SOLARA_RC_IOS_KEY        : RevenueCat iOS Public SDK key (appl_xxx)  ← Secure
#        - SOLARA_FREERASP_IOS_TEAM_ID : Apple Team ID (10桁、任意。未設定なら RASP は no-op)
#        - APP_STORE_APP_ID         : App Store Connect のアプリ数値 ID (App Information > Apple ID)
#   3. Apple Developer ポータルで App ID com.solodevlab.solara の
#      「Sign In with Apple」capability を有効化 (自動署名のプロファイル生成に必要)。
#
# 実行: Codemagic ダッシュボードから手動で Start build (push 自動トリガはしない=無料枠節約)。

workflows:
  ios-release:
    name: Solara iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/solara
    integrations:
      # ↓ Codemagic UI に登録した App Store Connect API キーの「名前」と一致させること
      app_store_connect: "Solara ASC Key"
    environment:
      groups:
        - solara_ios_secrets   # SOLARA_RC_IOS_KEY / SOLARA_FREERASP_IOS_TEAM_ID / APP_STORE_APP_ID
      ios_signing:
        # 自動署名: 証明書とプロビジョニングプロファイルを Codemagic がクラウドで自動生成。
        # 手元の Mac / .p12 作成は不要。
        distribution_type: app_store
        bundle_identifier: com.solodevlab.solara
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Pod install
        script: cd ios && pod install
      - name: Set up provisioning profiles
        # 取得済みのプロファイルを Xcode プロジェクトへ適用し、export_options.plist を生成
        script: xcode-project use-profiles
      - name: Increment build number
        # iOS の CFBundleVersion 名前空間は Android と独立。TestFlight 最新ビルド番号 + 1。
        # ビルドが1つも無い初回は 0 が返り +1 = 1 になる。
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" || echo 0)
          BUILD_NUMBER=$(($LATEST + 1))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
      - name: Flutter build ipa
        # --obfuscate / --split-debug-info は tools/build_release.py と整合 (クラッシュ復号用)。
        # RC iOS key 未注入だと Purchases.configure が skip され課金が動かないので必須。
        script: |
          flutter build ipa --release \
            --obfuscate --split-debug-info=build/symbols/ios \
            --build-number=$BUILD_NUMBER \
            --dart-define=SOLARA_RC_IOS_KEY=$SOLARA_RC_IOS_KEY \
            --dart-define=SOLARA_FREERASP_IOS_TEAM_ID=$SOLARA_FREERASP_IOS_TEAM_ID \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/symbols/ios/**          # クラッシュ deobfuscation 用シンボル (要外部保管)
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # ↓ TestFlight で実機動作 (特に IAP) を確認できたら有効化して審査提出する。
        # submit_to_app_store: true
        # release_type: MANUAL
