name = "solara-api"
main = "src/index.js"
compatibility_date = "2024-12-01"
# nodejs_compat: App Attest 検証で node:crypto (createHash/createVerify) が必要
compatibility_flags = ["nodejs_compat"]

# カスタムドメイン (solodev-lab.com は Cloudflare で DNS 管理中)
# custom_domain = true で Cloudflare が DNS + SSL を全自動発行
routes = [
  { pattern = "solara-api.solodev-lab.com", custom_domain = true }
]

# workers.dev サブドメイン も有効化 (デバッグ用 fallback)
workers_dev = true

# ── Observability (Workers Logs) ──────────────────────────────
# enabled=true で全リクエストのログ (console.warn 含む) をサーバー側に自動保存。
# CF ダッシュボード Workers & Pages > solara-api > Logs/Observability で後から
# 検索・絞り込み可能 (例: "would block" 検索で Play Integrity 誤ブロック有無を確認)。
# wrangler tail を開きっぱなしにしなくてよくなる。保存期間は概ね Free=3日/Paid=7日。
# head_sampling_rate=1 → 100% 記録 (低トラフィックなので全件保存で問題なし)。
[observability]
enabled = true
head_sampling_rate = 1

[vars]
# GEMINI_API_KEY は wrangler secret put GEMINI_API_KEY で設定
# GOOGLE_PLACES_KEY は wrangler secret put GOOGLE_PLACES_KEY で設定
# JAWG_TOKEN は将来 Jawg 多言語タイルを再導入する場合に再利用可能（CF secret に残置）

# ── Gemini モデル設定 ──────────────────────────────
# 廃止リスク対策で env var 化。コード変更せず wrangler deploy で切替可能。
# 廃止時は両方を新世代モデル（例: gemini-3-flash, gemini-3.1-flash-lite）に書き換え。
# - PRIMARY: 安定動作の明示版（突然死リスクあり）
# - FALLBACK: -latest エイリアス（preview指定で挙動変化リスクあり、ただし廃止リスクなし）
# どちらか片方が死んでも、もう一方が拾う二重保険構成。
TAROT_MODEL_PRIMARY = "gemini-2.5-flash"
TAROT_MODEL_FALLBACK = "gemini-flash-latest"
FORTUNE_MODEL_PRIMARY = "gemini-2.5-flash"
FORTUNE_MODEL_FALLBACK = "gemini-flash-latest"

# ── Stella 相談 Free 試食クレジット (設計 project_solara_stella_free_credits.md) ──
# Free ユーザーが Stella 相談を試食できる「無料クレジット」の設定。コード変更/再ビルド不要で
# wrangler deploy だけで調整できる。
#   CONSULTATION_FREE_MODES   : 無料試食できるモードの CSV。3 モード全部 or "daily" だけ等に変更可。
#                               (migration=移住 / travel=旅行 / daily=おでかけ「今日どこ行こう」)
#   CONSULTATION_FREE_WEEKLY  : 週あたり無料回数 (端末ごと、月曜 UTC リセット)。
# Pro は週 N 回 (CONSULTATION_PRO_WEEKLY、default 100) + thinking ON + 出し直し可。
# Free は thinking OFF + 出し直し不可。
CONSULTATION_FREE_MODES = "migration,travel,daily"
CONSULTATION_FREE_WEEKLY = "3"
# Pro 週次キャップ (2026-05-27 追加。Gemini API 課金破綻防止の最終線)。
# 100/週 ≈ 月 430 回 ≈ 日平均 14 回 < 20 回/日 breakeven。バースト (1 日 100 連発) でも
# 月平均で見れば赤字回避できる設計。Pro が 100/週 を超えたら購入クレジット消費に
# フォールバックし、それも 0 なら 402 (consultation_pro_weekly_exhausted)。
# Free 週次カウンタ (consultation_credits 表) とは別キー (consultation_pro_credits 表)
# で持つため、Free→Pro upgrade 時に Pro 100 がフルで使える。
CONSULTATION_PRO_WEEKLY = "100"
# 消費型クレジット商品 (B案、有料追加クレジット)。"商品ID:付与数" を CSV で。
# 🚨 オーナー作業: App Store Connect / Google Play / RevenueCat で同じ商品 ID の消費型 IAP を作成。
# 価格は各ストアで設定 (提案: small=3個 $2.99/¥450、large=10個 $8.99/¥1,300、Pro へ寄せた割高設定)。
# 商品 ID/付与数は後から変更可 (deploy のみ)。RC NON_RENEWING_PURCHASE Webhook で残高加算。
CONSULTATION_CREDIT_PRODUCTS = "com.solodevlab.solara.credits.small:3,com.solodevlab.solara.credits.large:10"

# ── App Attest 設定 (設計 v1.9 §16 確定値) ──────────
# どちらも public 情報 (Bundle ID から推測可能、Team ID も同じ)、secret 不要
APPLE_TEAM_ID = "TY5JW393Q5"
APPLE_BUNDLE_ID = "com.solodevlab.solara"

# ── Sign in with Apple Token Revocation (設定手順: project_solara_apple_siwa_revoke_setup.md) ──
# Apple Sign In のトークンを Apple 側で revoke するための公開 ID 群。
# Service ID: 専用に作った Services ID identifier (App ID com.solodevlab.solara とは別)。
# Key ID: Sign in with Apple Authentication Key の 10 桁 ID。
# Private key (.p8) は wrangler secret put APPLE_SIWA_PRIVATE_KEY で別途登録。
# 鍵未設定の間は worker/src/auth/apple_revoke.js が no-op skip (reason: 'secrets_missing')。
APPLE_SIWA_SERVICE_ID = "com.solodevlab.solara.signin"
APPLE_SIWA_KEY_ID = "D8BGKZW2AJ"

# App Attest middleware の段階的有効化スイッチ:
#   "disabled"  - middleware 完全スキップ (緊急時 kill switch)
#   "log_only"  - 検証は走るが失敗しても通す + console.warn (初回 deploy 推奨)
#   "enforced"  - 検証失敗で 401 (本番想定、Flutter 側準備完了後)
# 初期値は log_only。Flutter 側の attestation 実装 + 1 週間モニタ後に enforced へ。
APP_ATTEST_ENFORCEMENT = "log_only"

# Per-user quota (Layer C、設計 v1.8 §13)
# Free=日 30 / Pro=日 200 (2026-05-26: Pro 50→200。残数照会 (/consultation/credits)
# をクォータ対象外にしたため、クォータは「AI 実行回数の上限」として機能する
# (Gemini 呼出コスト乱用ガード)。
# - Free 30: 通常使用なら超えない (相談 + Tarot で AI 実行 5-15回/日)
#   攻撃・バグで AI 連打されたときのコストガード。
# - Pro 200: 「無制限」謳いと整合する大きめ値。テール乱用 (1日中 AI 連打) だけ遮断。
# 実ブロックは enforcement=enforced 時に発動、log_only 中は warn のみ。
APP_ATTEST_QUOTA_FREE = "30"
APP_ATTEST_QUOTA_PRO = "200"

# Challenge TTL (設計 v1.8 §11 Q2、Apple Sample Code 推奨 5 分)
APP_ATTEST_CHALLENGE_TTL_SEC = "300"

# ── Play Integrity 設定 (設計 v1.1、apps/solara/docs/play_integrity_design.md) ──
#
# 🚨 v1.1 訂正 (2026-05-20、R8 実機失敗): Standard request の token は JWE ではなく
#    Google 独自 protobuf 形式で、Self-managed key で local decode 不可と判明。
#    → Google decodeIntegrityToken API 経由に変更。Service Account credentials が必要。
#
# GOOGLE_PLAY_INTEGRITY_SA_JSON は wrangler secret に入れる (vars に書かない):
#   wrangler secret put GOOGLE_PLAY_INTEGRITY_SA_JSON
#     → Google Cloud Console > Solara-api project > IAM > Service Accounts で作成した
#        SA の JSON credentials (private_key + client_email を含む) を貼り付け
#     → SA に「Play Integrity API ユーザー」role 付与必須
#   Worker は private_key で RS256 JWT 署名 → OAuth2 access token 取得 →
#   playintegrity.googleapis.com/v1/<pkg>:decodeIntegrityToken で token 復号
#
# 旧 Self-managed key (PLAY_INTEGRITY_ENCRYPTION_KEY / VERIFICATION_KEY) は
# wrangler secret に残置 (将来 Classic request に戻す場合の保険、削除しない)。
# v1.1 では未使用。
#
# Android 経路の段階的有効化スイッチ (App Attest と独立、iOS/Android のロールアウト差を吸収):
#   "disabled" - middleware Android 経路スキップ (緊急時 kill switch)
#   "log_only" - 検証走るが失敗しても通す + console.warn (初回 Android deploy 推奨)
#   "enforced" - 検証失敗で 401 (Flutter Android 実装 + 1 週間モニタ後に切替)
# 初期値 log_only。
PLAY_INTEGRITY_ENFORCEMENT = "log_only"

# Play Integrity Standard nonce TTL (= /auth/integrity/challenge で発行する nonce の DO 寿命)
PLAY_INTEGRITY_NONCE_TTL_SEC = "300"

# Android のパッケージ名 (DEFAULT_ANDROID_PACKAGE_NAME と同値、wrangler で上書きする用)
# Play Integrity payload の requestDetails.requestPackageName + appIntegrity.packageName と一致確認
ANDROID_PACKAGE_NAME = "com.solodevlab.solara"

# Play 配信用 cert SHA-256 の allowlist (CSV、=サイドロード排除の最終層)。
# 空 → cert check skip。
# 2026-05-20 (R8 突破時、S7): 実機 decode-test で Play App Signing cert を採取し反映。
#   payload.appIntegrity.certificateSha256Digest = "-XyvOn4yrVJdrby9VfkwejUq7Zt4431y4QC-r8raucY"
#   (URL-safe base64 / padding なし。Step 11 は文字列完全一致で評価)
# 将来 Play App Signing の key rotation や別トラック cert 追加時は CSV で並べる:
#   ANDROID_CERT_SHA256_ALLOWLIST = "-XyvOn...,AbCdEf..."
ANDROID_CERT_SHA256_ALLOWLIST = "-XyvOn4yrVJdrby9VfkwejUq7Zt4431y4QC-r8raucY"

# ── RevenueCat Webhook 設定 (設計 v2.2 §B、apps/solara/docs/revenuecat_webhook.md) ──
#
# REVENUECAT_WEBHOOK_AUTH は wrangler secret に入れる (vars に書かない):
#   wrangler secret put REVENUECAT_WEBHOOK_AUTH
#     → 長さ 32B 以上のランダム文字列を入力
#     → 同じ値を RevenueCat ダッシュボード Project settings → Integrations → Webhooks
#        の Authorization header に "Bearer <value>" の形で貼る
#
# 未設定時、/webhooks/revenuecat は 503 を返して受信を拒絶する (公開前ガード)。
# 値が漏れた場合は wrangler secret put で上書きし、RC dashboard 側も同時更新。

# KV: /astro/forecast の月次クォータ用。
# 有効化手順:
#   1. wrangler kv namespace create FORECAST_KV
#   2. 出力された id を下の kv_namespaces に貼る
#   3. wrangler deploy
# binding なしでもサーバーは動作する（checkKvForecastQuota が no-op）
# [[kv_namespaces]]
# binding = "FORECAST_KV"
# id = "<namespace_id>"

# ── Durable Object (App Attest 用、設計 v1.8 §6.1) ──
# 全 keyId を 1 instance に集約 (idFromName('global'))。
# 初回 deploy 時に migration tag v1 が走り SQLite-backed DO が作成される。
[[durable_objects.bindings]]
name = "ATTESTATION_DO"
class_name = "AttestationState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AttestationState"]
