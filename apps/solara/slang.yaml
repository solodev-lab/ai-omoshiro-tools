# slang i18n 設定 (Solara)
#
# 正典: docs/i18n_glossary.md / memory project_solara_voice_i18n_canon
#   - base_locale=ja: 日本語がマスター(STYLE_VOICE_JP)。全言語はここから派生。
#   - fallback_strategy=base_locale: 未訳キーは ja へフォールバック
#       (= EN カバレッジが揃うまで「半英語UI」を出さない完成度ゲートと併用。
#        未訳の検出は `dart run slang analyze` で行う)。
#   - flat_map=true: 既存 tr(String key) 互換のため動的キーアクセス t['a.b'] を生成。
#   - lazy=false: 全ロケールを同梱しロケール切替を同期的に (ja/en の少数なので問題なし)。
#   - timestamp=false: 生成物のタイムスタンプ差分を出さない (再現性・clean diff)。
#
# 将来 es/pt/fr/de/ko を足すときは lib/i18n/strings_<locale>.i18n.json を追加して再生成。

base_locale: ja
fallback_strategy: base_locale
input_directory: lib/i18n
input_file_pattern: .i18n.json
output_directory: lib/i18n
output_file_name: strings.g.dart
flat_map: true
lazy: false
timestamp: false
flutter_integration: true
